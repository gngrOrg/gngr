name: Build

on:
  push:
  pull_request:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: read

jobs:
  compile:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '25']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install --yes ant

      - name: Compile project
        run: ant -f src/build.xml build

  test:
    if: (github.event_name == 'push') || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '!run-test')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        java-version: ['11', '25']
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}
          persist-credentials: false

      - name: Set up Java 25 for Grinder
        id: java-grinder
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Java ${{ matrix.java-version }}
        if: matrix.java-version != '25'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes ant xvfb xauth

      - name: Run tests
        env:
          GRINDER_JAVA: ${{ steps.java-grinder.outputs.path }}/bin/java
        run: bash misc/runTest.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grinder-report-jdk${{ matrix.java-version }}
          path: ~/grinderTest/grinder-report/
          retention-days: 30
